name: Quest 0.50 ARM64
on:
  push:
    branches: [quest-vr-0.50-stable]
    paths:
      - 'android/**'
      - 'apps/**'
      - 'components/**'
      - 'extern/**'
      - 'files/**'
      - 'CMakeLists.txt'
      - '.github/workflows/quest050.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quest050-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NCPU_OVERRIDE: '2'
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx2g'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config autoconf automake libtool gettext curl unzip zip yasm nasm gdb
      - uses: actions/cache@v4
        with:
          path: |
            android/buildscripts/downloads
            android/buildscripts/toolchain
            android/buildscripts/prefix
            android/buildscripts/build
          key: quest050-native-v1-${{ runner.os }}-${{ hashFiles('android/buildscripts/**') }}
          restore-keys: quest050-native-v1-${{ runner.os }}-
      - name: Compile native ARM64 engine
        shell: bash
        run: |
          set -o pipefail
          cd android/buildscripts
          ./build.sh --release 2>&1 | tee ../../quest050-native-build.log
      - name: Package APK
        shell: bash
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          cd android
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/OpenMW-VR-Quest-v0.50-stable.apk
          cd ../dist
          sha256sum *.apk > SHA256SUMS
          git rev-parse HEAD > SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMW-VR-Quest-v0.50-stable
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Quest050-diagnostics-${{ github.sha }}
          path: |
            android/quest050-native-build.log
            android/buildscripts/symbols/arm64-v8a/
            android/buildscripts/build/arm64/**/CMakeFiles/CMake*.log
            android/buildscripts/build/arm64/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
